name: Update genre charts

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-charts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/update-charts.mjs
      - name: Commit if the playlists moved
        run: |
          if git diff --quiet -- charts.json; then exit 0; fi
          git config user.name "dtd-chart-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts.json
          git commit -m "Update genre charts"
          git push
