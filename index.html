<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Do the Dance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
/* Deep-space edition. Reference: AOZ — black starfield, one thin orbit line snaking through glowing planets,
   wide-set techno capitals for names and catalogue codes, everything else quiet. */
:root{
  --space:#000; --fg:#f2f1f7; --muted:#8e8ba3; --faint:#4a4760; --line:rgba(242,241,247,.16); --orbit:rgba(242,241,247,.55);
  --hyp:#ff5fd2; --kj:#6fe6ff; --pop:#ffd95a; --rnb:#ff7a4d; --rap:#a6f56a; --groove:#a991ff;
  --up:#7dffb2; --down:#ff6b8a;
  --f-wide:"Michroma","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"Figtree","IBM Plex Sans KR",system-ui,sans-serif;
  --f-ja:"Noto Sans JP","Figtree",system-ui,sans-serif;
  --f-zh:"Noto Sans SC","Figtree",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--space)}
body{margin:0;background:var(--space);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
:lang(ja) body{font-family:var(--f-ja)} :lang(zh) body{font-family:var(--f-zh)}
a{color:inherit}
[hidden]{display:none!important}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.page{position:relative;z-index:1}
.wide{font-family:var(--f-wide);text-transform:uppercase;letter-spacing:.14em;font-weight:400}
:focus-visible{outline:1.5px solid var(--fg);outline-offset:3px}

/* NAV — AOZ top bar */
nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:28px;padding:14px max(20px,env(safe-area-inset-left)) 14px max(20px,env(safe-area-inset-right));
  background:linear-gradient(#000 60%,rgba(0,0,0,0))}
.logo{font-family:var(--f-wide);font-size:15px;letter-spacing:.32em;text-decoration:none;white-space:nowrap}
.tabs{display:flex;gap:22px}
.tabs a{font-family:var(--f-wide);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:6px 0;border-bottom:1px solid transparent}
.tabs a[aria-current="page"]{color:var(--fg);border-color:var(--fg)}
.tabs a:hover{color:var(--fg)}
.lang{margin-left:auto;display:flex;gap:12px}
.dev{margin-left:auto;font-family:"IBM Plex Sans KR",var(--f-body);font-size:11px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.lang button{appearance:none;background:none;border:0;padding:6px 0;color:var(--muted);font-family:var(--f-wide);font-size:9.5px;letter-spacing:.16em;cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--fg)}

.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}

/* HERO */
.hero{text-align:center;padding:12vh 0 7vh}
.hero h1{margin:0;font-family:var(--f-wide);font-weight:400;font-size:clamp(30px,6.4vw,78px);letter-spacing:.34em;line-height:1.15;margin-right:-.34em}
.hero .tag{margin:18px 0 0;font-family:var(--f-wide);font-size:clamp(8.5px,1vw,11px);letter-spacing:.24em;text-transform:uppercase;color:var(--fg);opacity:.85}
.hero .intro{max-width:46ch;margin:34px auto 0;color:var(--muted);font-size:14px;text-wrap:pretty}
.stats{display:flex;justify-content:center;gap:clamp(28px,6vw,72px);margin-top:36px}
.stat{display:grid;gap:6px}
.stat b{font-family:var(--f-wide);font-weight:400;font-size:clamp(20px,2.6vw,30px);letter-spacing:.06em}
.stat small{font-family:var(--f-wide);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* ATLAS CONTROLS */
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;justify-content:center;padding:14px 0 18px}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.chip,.seg button{appearance:none;background:transparent;border:1px solid var(--line);color:var(--fg);font-family:var(--f-wide);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:9px 12px;border-radius:99px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:opacity .15s,border-color .15s,background .15s}
.chip:hover{border-color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.chip:not(.mood)[aria-pressed="false"]{opacity:.35}.chip.mood{color:var(--muted)}
.chip.mood[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--fg);color:#000;border-color:var(--fg)}
.seg{display:inline-flex;gap:4px}
.search{appearance:none;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--fg);font:400 13px var(--f-body);padding:9px 14px;border-radius:99px;width:200px;max-width:100%}
.search::placeholder{color:var(--muted)}

/* ATLAS MAP */
.map-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.map{position:relative;width:100%;min-width:920px;aspect-ratio:1000/700}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cont{position:absolute;transform:translate(-50%,-100%);display:grid;justify-items:center;gap:8px;pointer-events:none;transition:opacity .4s;text-align:center}
.cont .ball{width:var(--sz,38px);height:var(--sz,38px)}
.cont b{font-family:var(--f-wide);font-weight:400;font-size:10px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 10px #000,0 0 3px #000}
.cont small{font-family:var(--f-wide);font-size:7.5px;letter-spacing:.16em;color:var(--muted);margin-top:-4px;white-space:nowrap;text-shadow:0 0 6px #000}
.map.grid .cont{opacity:0}
.axis,.quad{position:absolute;pointer-events:none;opacity:0;transition:opacity .4s;font-family:var(--f-wide);text-transform:uppercase}
.axis{font-size:8.5px;letter-spacing:.18em}
.quad{font-size:clamp(18px,2.6vw,34px);letter-spacing:.2em;line-height:1}
.map.grid .axis{opacity:.7}.map.grid .quad{opacity:.1}
.pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;display:grid;place-items:center;text-decoration:none;z-index:2;transition:opacity .25s,transform .15s}
.pin::before{content:"";width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 3px 1px var(--c),0 0 10px 2px var(--c)}
.pin:hover,.pin.sel{transform:scale(1.9);z-index:4}
.pin.dim{opacity:.08}
.pin.hit::after{content:"";position:absolute;inset:-3px;border:1px solid var(--fg);border-radius:50%}
.tip{position:absolute;z-index:6;pointer-events:none;background:rgba(6,6,12,.92);border:1px solid var(--line);color:var(--fg);padding:10px 12px;border-radius:2px;min-width:160px;max-width:250px;transform:translate(-50%,calc(-100% - 16px));opacity:0;transition:opacity .12s;backdrop-filter:blur(6px)}
.tip.on{opacity:1}
.tip .t{font-weight:700;font-size:16px;line-height:1.2}
.tip .a{font-size:12px;color:var(--muted);margin-top:2px}
.tip .m,.tip .go{font-family:var(--f-wide);font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:8px}
.tip .go{color:var(--muted);margin-top:4px}
.map-note{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;font-size:12px;color:var(--muted);padding-top:8px}

/* TRACK INDEX */
.sec-head{text-align:center;padding:14vh 0 40px}
.sec-head h2{margin:0;font-family:var(--f-wide);font-weight:400;font-size:clamp(20px,3vw,34px);letter-spacing:.3em;margin-right:-.3em}
.sec-head p{margin:14px auto 0;max-width:52ch;color:var(--muted);font-size:13px}
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:40px 28px;align-items:start}
.idx section{min-width:0}
.idx h3{margin:0 0 10px;display:flex;align-items:center;gap:12px;font-family:var(--f-wide);font-weight:400;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.idx h3 .ball{width:22px;height:22px;flex:none}
.idx h3 small{margin-left:auto;color:var(--muted);font-size:9px}
.idx ol{list-style:none;margin:0;padding:0}
.idx a{display:grid;grid-template-columns:2.8em 1fr;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:13px;align-items:baseline}
.idx a:hover .tt{text-decoration:underline}
.idx .no{font-family:var(--f-wide);font-size:8.5px;color:var(--muted);letter-spacing:.06em}
.idx .tt{font-weight:600;overflow-wrap:anywhere}
.idx .ar{display:block;font-weight:400;color:var(--muted);font-size:12px}
.idx li.dim{opacity:.22}

/* PLANETS — shared sphere */
.ball{border-radius:50%;position:relative;flex:none;overflow:hidden;
  background:
    radial-gradient(circle at 30% 26%,rgba(255,255,255,.75),rgba(255,255,255,0) 26%),
    radial-gradient(ellipse 60% 35% at 62% 38%,color-mix(in oklab,var(--c) 40%,#fff) ,transparent 70%),
    radial-gradient(ellipse 45% 30% at 30% 68%,color-mix(in oklab,var(--c) 55%,#000),transparent 72%),
    radial-gradient(ellipse 35% 22% at 75% 70%,color-mix(in oklab,var(--c) 65%,#fff),transparent 70%),
    radial-gradient(ellipse 70% 18% at 45% 50%,color-mix(in oklab,var(--c) 80%,#000),transparent 70%),
    var(--c);
  box-shadow:inset -7px -9px 16px rgba(0,0,0,.65),inset 3px 3px 9px rgba(255,255,255,.3),0 0 22px color-mix(in oklab,var(--c) 50%,transparent),0 0 1.5px rgba(255,255,255,.7);
  transform:rotate(var(--rot,0deg))}
/* CHARTS */
.ch-head{text-align:center;padding:10vh 0 10px}
.ch-head h2{margin:0;font-family:var(--f-wide);font-weight:400;font-size:clamp(26px,5vw,60px);letter-spacing:.3em;margin-right:-.3em;line-height:1.15}
.ch-head .tag{margin:16px 0 0;font-family:var(--f-wide);font-size:clamp(8.5px,1vw,11px);letter-spacing:.24em;text-transform:uppercase}
.ch-meta{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 26px;margin-top:22px;font-size:12px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:8px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
.live.stale i{background:var(--muted);box-shadow:none}
@media (prefers-reduced-motion:no-preference){.live i{animation:pulse 2.4s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.25}}

.orbit{position:relative;margin:30px auto 90px;max-width:1100px}
.orbit svg{display:block;width:100%;height:auto;overflow:visible}
.orbit path{fill:none;stroke:var(--orbit);stroke-width:1;vector-effect:non-scaling-stroke}
.pl{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:10px;appearance:none;background:none;border:0;color:var(--fg);cursor:pointer;padding:0;font:inherit;text-align:center}
.pl .ball{width:var(--sz);height:var(--sz);transition:transform .25s}
.pl:hover .ball,.pl[aria-pressed="true"] .ball{transform:rotate(var(--rot,0deg)) scale(1.12)}
.pl .ring{position:absolute;left:50%;top:calc(var(--sz)/2);width:calc(var(--sz) * 1.7);height:calc(var(--sz) * .5);transform:translate(-50%,-50%) rotate(-18deg);border:1px solid color-mix(in oklab,var(--c) 70%,#fff);border-radius:50%;opacity:.85;pointer-events:none}
.pl .lbl{position:absolute;top:calc(var(--sz) + 10px);width:max-content;max-width:170px;display:grid;gap:3px;justify-items:center}
.pl b{font-family:var(--f-wide);font-weight:400;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.pl .pn{font-size:10.5px;color:var(--fg);opacity:.75;white-space:nowrap}
.pl .one{font-size:11px;color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl[aria-pressed="true"] b{text-decoration:underline;text-underline-offset:4px}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 28px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend .ring-ico{width:22px;height:8px;border:1px solid var(--fg);border-radius:50%;transform:rotate(-18deg)}

/* board: 17 charts at a glance */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:24px}
.mini{background:#000;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 14px 10px;min-width:0;cursor:pointer;appearance:none;border:0;color:var(--fg);text-align:left;font:inherit;display:grid;gap:10px;align-content:start}
.mini:hover{background:#07070d}
.mini[aria-pressed="true"]{background:#0b0b14;box-shadow:inset 0 0 0 1px var(--c)}
.mini header{display:flex;align-items:center;gap:10px}
.mini header .ball{width:16px;height:16px}
.mini header small{margin-left:auto;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.mini header b{font-family:var(--f-wide);font-weight:400;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini ol{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.mini li{display:grid;grid-template-columns:1.4em 1fr auto;gap:8px;align-items:baseline;font-size:12px;line-height:1.3}
.mini li .r{font-family:var(--f-wide);font-size:8.5px;color:var(--muted)}
.mini li .s{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini li .s small{color:var(--muted);font-size:11px}
.mv{font-family:var(--f-wide);font-size:7.5px;letter-spacing:.06em;white-space:nowrap}
.mv.up{color:var(--up)}.mv.dn{color:var(--down)}.mv.nw{color:#000;background:var(--up);padding:1px 4px;border-radius:2px}.mv.eq{color:var(--faint)}

/* focus: one chart up close, giant planet rising (AOZ "SIWA") */
.focus{position:relative;margin-top:16vh;text-align:center;padding-bottom:40px}
.focus h3{margin:0;font-family:var(--f-wide);font-weight:400;font-size:clamp(18px,2.6vw,28px);letter-spacing:.22em;line-height:1.35}
.focus .code{display:block;font-size:.8em}
.focus .planet-rise{width:min(520px,80vw);aspect-ratio:2/1;margin:26px auto 0;overflow:hidden;position:relative;border-bottom:1px solid var(--line)}
.focus .planet-rise .ball{position:absolute;left:0;top:0;width:100%;aspect-ratio:1;--rot:0deg;box-shadow:inset -30px -40px 70px rgba(0,0,0,.55),inset 10px 10px 40px rgba(255,255,255,.2),0 0 60px color-mix(in oklab,var(--c) 50%,transparent)}
.focus table{width:100%;max-width:820px;margin:28px auto 0;border-collapse:collapse;text-align:left;font-size:13px}
.focus th{font-family:var(--f-wide);font-weight:400;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:0 8px 10px;border-bottom:1px solid var(--line)}
.focus td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:baseline}
.focus td.r{font-family:var(--f-wide);font-size:10px;width:3em}
.focus td.n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.focus td .t{font-weight:600;text-decoration:none}.focus td a.t:hover{text-decoration:underline}
.focus td .a{color:var(--muted);font-size:12px}
.focus .open{display:inline-block;margin-top:22px;font-family:var(--f-wide);font-size:9px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line);padding:11px 16px;border-radius:99px}
.focus .open:hover{border-color:var(--fg)}
.empty{text-align:center;color:var(--muted);padding:60px 0}

/* touch card */
.card{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(6,6,12,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px);
  padding:14px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  display:flex;gap:14px;align-items:center;justify-content:space-between;transform:translateY(110%);transition:transform .25s}
.card:not(.on){visibility:hidden}.card.on{transform:none}
.card .info{min-width:0}.card .t{font-weight:700;font-size:19px;line-height:1.2;overflow-wrap:anywhere}.card .a{font-size:13px;color:var(--muted)}
.card .m{font-family:var(--f-wide);font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.card .btns{display:flex;gap:8px;flex:none}
.card a,.card button{appearance:none;border:1px solid var(--line);background:none;color:var(--fg);border-radius:99px;font-family:var(--f-wide);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;padding:11px 14px;cursor:pointer;text-decoration:none}
.card a{background:var(--fg);color:#000;border-color:var(--fg)}

footer{margin-top:16vh;border-top:1px solid var(--line);padding:26px 0 calc(40px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 40px;font-size:11px;color:var(--muted)}
footer .logo{color:var(--fg);font-size:12px}
footer a{font-family:var(--f-wide);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
footer a:hover{color:var(--fg)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:720px){
  nav{gap:12px 16px;flex-wrap:wrap}.logo{order:0}.dev{order:1}.tabs{order:2;width:100%}.lang{order:3;margin-left:0}.logo{font-size:13px;letter-spacing:.24em}.tabs{gap:16px}
  .hero{padding-top:8vh}.search{width:100%}
  .pl .one,.pl .pn{display:none}.pl b{font-size:7.5px}
  .board{grid-template-columns:1fr 1fr}.mini{padding:12px 10px}.mini li{grid-template-columns:1.2em 1fr;}.mini li .mv{display:none}
}
/* DANCE LINEAGE */
.h-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:34px}
.h-inner{min-width:900px}
.h-map{position:relative;width:100%}
.h-map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.h-grid{stroke:rgba(242,241,247,.07);stroke-width:1;vector-effect:non-scaling-stroke}
.h-yr{fill:var(--muted);font-family:var(--f-wide);font-size:8px;letter-spacing:.14em;text-anchor:middle}
.h-tail{stroke-width:1;opacity:.28;vector-effect:non-scaling-stroke}
.h-peak{stroke-width:2.5;opacity:.9;stroke-linecap:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px currentColor)}
.h-link{fill:none;stroke:rgba(242,241,247,.35);stroke-width:1;stroke-dasharray:2 5;vector-effect:non-scaling-stroke}
.hn{position:absolute;transform:translate(-50%,-50%);appearance:none;background:none;border:0;padding:0;color:var(--fg);cursor:pointer;display:flex;align-items:center;font:inherit}
.hn .ball{width:24px;height:24px;transition:transform .2s}
.hn:hover .ball,.hn[aria-pressed="true"] .ball{transform:scale(1.35)}
.hn .hl{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);display:grid;gap:2px;white-space:nowrap;text-align:left;text-shadow:0 0 8px #000,0 0 3px #000}
.hn.r .hl{left:auto;right:calc(100% + 10px);text-align:right}
.hn b{font-family:var(--f-wide);font-weight:400;font-size:9.5px;letter-spacing:.14em}
.hn small{font-size:10.5px;color:var(--muted)}
.hn[aria-pressed="true"] b{text-decoration:underline;text-underline-offset:4px}
.h-eras-wrap{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.h-eras-wrap > p{margin:0 0 10px;font-family:var(--f-wide);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.h-lane{position:relative;height:26px;margin-bottom:6px}
.h-lane span{position:absolute;top:0;height:100%;display:flex;align-items:center;padding:0 8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.035);color:var(--fg)}
.h-focus{margin-top:12vh;--c:#fff}
.hf-head{display:flex;align-items:center;gap:20px;justify-content:center;text-align:left}
.hf-head .ball{width:64px;height:64px}
.hf-head h3{margin:0;font-family:var(--f-wide);font-weight:400;font-size:clamp(20px,3vw,32px);letter-spacing:.16em}
.hf-head .code{margin:6px 0 0;font-family:var(--f-wide);font-size:8.5px;letter-spacing:.18em;color:var(--muted)}
.hf-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;max-width:980px;margin:36px auto 0}
.hf-grid h4{margin:0 0 8px;font-family:var(--f-wide);font-weight:400;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--c)}
.hf-grid p{margin:0 0 22px;font-size:14px;line-height:1.75;max-width:60ch;text-wrap:pretty}

const mean={};keys.forEach(k=>{const l=songs.filter(s=>s.g===k);mean[k]=[l.reduce((n,s)=>n+s.b,0)/l.length,l.reduce((n,s)=>n+s.e,0)/l.length]});
const clampX=x=>Math.max(16,Math.min(W-16,x)),clampY=y=>Math.max(16,Math.min(H-16,y));
songs.forEach((s,i)=>{const G=GENRES[s.g],j1=hash(s.t+s.a)-.5,j2=hash(s.a+s.t+i)-.5;
  s.atlas=[clampX(G.cx+(s.b-mean[s.g][0])*G.sx+j1*14),clampY(G.cy+(mean[s.g][1]-s.e)*G.sy+j2*14)];
  s.grid=[clampX(60+s.b*880+j1*16),clampY(50+(1-(s.e-.28)/.72)*(H-110)+j2*14)]});
function relax(key,min){for(let it=0;it<50;it++){let moved=false;for(let i=0;i<songs.length;i++)for(let j=i+1;j<songs.length;j++){
  const p=songs[i][key],q=songs[j][key];let dx=q[0]-p[0],dy=q[1]-p[1];const d=Math.hypot(dx,dy)||.01;if(d<min){const m=(min-d)/2;dx/=d;dy/=d;
  p[0]=clampX(p[0]-dx*m);p[1]=clampY(p[1]-dy*m);q[0]=clampX(q[0]+dx*m);q[1]=clampY(q[1]+dy*m);moved=true}}if(!moved)break}}

songs.forEach(s=>s.p=[...s.atlas]);

function meta(s){return ("#"+String(s.no).padStart(3,"0")+"  "+GENRES[s.g].name+"  "+s.mood+" "+(L().mood[s.mood]||"")).trim()}
function showTip(s){if(touch)return;tip.innerHTML='<div class="t"></div><div class="a"></div><div class="m"></div><div class="go"></div>';tip.querySelector(".go").textContent=L().go;
  tip.querySelector(".t").textContent=s.t;tip.querySelector(".a").textContent=s.a;tip.querySelector(".m").textContent=meta(s);
  tip.style.left=(s.p[0]/W*100)+"%";tip.style.top=(s.p[1]/H*100)+"%";
  tip.style.transform="translate("+(s.p[0]<130?"-12%":s.p[0]>870?"-88%":"-50%")+","+(s.p[1]<130?"18px":"calc(-100% - 16px)")+")";tip.classList.add("on")}

  s.el.classList.toggle("dim",!v||(state.q&&!hit));s.el.classList.toggle("hit",!!hit&&v);if(v)n++;s.li&&s.li.classList.toggle("dim",!v||(state.q&&!hit))});

function setMode(m){if(state.mode===m)return;state.mode=m;bA.setAttribute("aria-pressed",m==="atlas");bG.setAttribute("aria-pressed",m==="grid");map.classList.toggle("grid",m==="grid");animate()}

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function animate(){hideTip();const from=songs.map(s=>[...s.p]);const t0=performance.now(),dur=reduce?0:900;
  function step(now){const k=dur?Math.min(1,(now-t0)/dur):1;const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    songs.forEach((s,i)=>{const to=s[state.mode];s.p=[from[i][0]+(to[0]-from[i][0])*e,from[i][1]+(to[1]-from[i][1])*e]});place();draw();if(k<1)requestAnimationFrame(step)}
  requestAnimationFrame(step)}
function place(){songs.forEach(s=>{s.el.style.left=(s.p[0]/W*100)+"%";s.el.style.top=(s.p[1]/H*100)+"%"})}

/* nebulae + orbit line through the six planets */
const cv=document.getElementById("land"),ctx=cv.getContext("2d");
function resize(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);cv.width=r.width*dpr;cv.height=r.height*dpr;const sc=r.width/W;ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0);draw()}
const rgb={};keys.forEach(k=>{const h=col(k).replace("#","");rgb[k]=[0,2,4].map(i=>parseInt(h.substr(i,2),16))});
const ORDER=["RAP","POP","KJ","GRV","HYP","RNB"];
function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.globalCompositeOperation="lighter";
  for(const s of songs){if(!visible(s))continue;const c=rgb[s.g],g=ctx.createRadialGradient(s.p[0],s.p[1],0,s.p[0],s.p[1],58);
    g.addColorStop(0,"rgba("+c+","+(state.mode==="grid"?.07:.09)+")");g.addColorStop(1,"rgba("+c+",0)");ctx.fillStyle=g;ctx.fillRect(s.p[0]-58,s.p[1]-58,116,116)}
  ctx.restore();
  ctx.strokeStyle="rgba(242,241,247,"+(state.mode==="atlas"?.42:.0)+")";ctx.lineWidth=1;
  if(state.mode==="atlas"){const cy=k=>GENRES[k].top-34-GENRES[k].sz/2;const P=[[-40,cy("RAP")-30]].concat(ORDER.map(k=>[GENRES[k].cx,cy(k)]));P.push([-40,cy("RNB")+60]);
    ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;ctx.quadraticCurveTo(a[0],a[1],mx,my)}ctx.lineTo(P[P.length-1][0],P[P.length-1][1]);ctx.stroke()}
  if(state.mode==="grid"){ctx.strokeStyle="rgba(242,241,247,.22)";ctx.setLineDash([2,6]);ctx.beginPath();ctx.moveTo(60+.5*880,20);ctx.lineTo(60+.5*880,H-20);
    const ym=50+(1-(.62-.28)/.72)*(H-110);ctx.moveTo(20,ym);ctx.lineTo(W-20,ym);ctx.stroke();ctx.setLineDash([])}}
new ResizeObserver(resize).observe(cv);

const DATA_URL="charts.json",POLL=5*60*1000;
let CH=null,chSel=0,lastStamp=null,loadFailed=false;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hueOf=i=>"hsl("+Math.round((i*360/17+285)%360)+" 82% 64%)";
function moveOf(t){if(t.p===undefined)return{c:"eq",s:"·"};if(t.p===null)return{c:"nw",s:L().newE};const d=t.p-t.r;return d>0?{c:"up",s:"▲"+d}:d<0?{c:"dn",s:"▼"+(-d)}:{c:"eq",s:"—"}}
function turnover(ch){const n=ch.tracks.length||1;return ch.tracks.reduce((s,t)=>s+(t.p===undefined?0:t.p===null?1:Math.min(1,Math.abs(t.p-t.r)/10)),0)/n}
function newTop(ch){const t=ch.tracks[0];return !!t&&t.p!==undefined&&t.p!==1}

async function loadCharts(){
  try{const r=await fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();loadFailed=false;
    if(d.updated!==lastStamp){lastStamp=d.updated;CH=d;if(chSel>=CH.charts.length)chSel=0;renderCharts()}}
  catch(e){loadFailed=true;if(!CH)renderCharts()}
  renderLive()}
function renderLive(){const D=L(),el=document.getElementById("live");el.classList.toggle("stale",loadFailed);
  let t=loadFailed?D.stale:D.live;if(CH&&CH.updated){t+="  ·  "+D.upd+" "+new Date(CH.updated).toLocaleString(lang,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}
  document.getElementById("live-t").textContent=t;document.getElementById("period").textContent=CH?L().period:""}

function orbitPath(w,h,rows,xl,xr){const pad=h/(rows*2),gap=(h-2*pad)/(rows-1);const P=[];for(let i=0;i<rows;i++)P.push([i%2?xl:xr,pad+i*gap]);
  let d="M "+(-w*.08)+" "+(pad-gap*.35)+" C "+(w*.3)+" "+(pad-gap*.35)+" "+P[0][0]+" "+(P[0][1]-gap*.45)+" "+P[0][0]+" "+P[0][1];
  for(let i=0;i<rows-1;i++){const a=P[i],b=P[i+1];d+=" C "+a[0]+" "+(a[1]+gap*.6)+" "+b[0]+" "+(b[1]-gap*.6)+" "+b[0]+" "+b[1]}
  const z=P[rows-1];d+=" C "+z[0]+" "+(z[1]+gap*.45)+" "+(z[0]<w/2?w*.7:w*.3)+" "+(z[1]+gap*.4)+" "+(z[0]<w/2?w*1.08:-w*.08)+" "+(z[1]+gap*.4);return d}
function layoutOrbit(){if(!CH||!CH.charts.length)return;const mob=innerWidth<720;const w=mob?400:1000,h=mob?2050:1080;
  const svg=document.getElementById("orbit-svg"),path=document.getElementById("orbit-path");svg.setAttribute("viewBox","0 0 "+w+" "+h);
  path.setAttribute("d",orbitPath(w,h,mob?9:5,mob?78:120,mob?322:880));
  const L0=path.getTotalLength(),n=CH.charts.length,a=.075,b=.93;
  document.querySelectorAll(".pl").forEach((el,i)=>{const p=path.getPointAtLength(L0*(a+(b-a)*(i/(n-1||1))));el.style.left=(p.x/w*100)+"%";el.style.top=(p.y/h*100)+"%";
    const tv=turnover(CH.charts[i]);el.style.setProperty("--sz",Math.round((mob?28:36)+tv*(mob?26:44))+"px")})}

function renderCharts(){const D=L(),pl=document.getElementById("planets"),bd=document.getElementById("board"),fc=document.getElementById("focus");
  if(!CH||!CH.charts||!CH.charts.length){pl.innerHTML="";bd.innerHTML="";document.getElementById("orbit-path").setAttribute("d","");fc.innerHTML='<p class="empty">'+esc(D.empty)+'</p>';return}
  pl.innerHTML=CH.charts.map((ch,i)=>{const t=ch.tracks[0]||{};return '<button type="button" class="pl" data-i="'+i+'" aria-pressed="'+(i===chSel)+'" style="--c:'+hueOf(i)+'">'+
    '<span class="ball" style="--rot:'+(i*47)+'deg"></span>'+(newTop(ch)?'<span class="ring"></span>':'')+
    '<span class="lbl"><b>'+esc(ch.genre)+'</b><span class="pn">'+esc(ch.name)+'</span><span class="one">'+esc(t.t)+'</span></span></button>'}).join("");
  bd.innerHTML=CH.charts.map((ch,i)=>'<button type="button" class="mini" data-i="'+i+'" aria-pressed="'+(i===chSel)+'" style="--c:'+hueOf(i)+'">'+
    '<header><span class="ball" style="--rot:'+(i*47)+'deg"></span><b>'+esc(ch.genre)+'</b><small>'+esc(ch.name)+'</small></header><ol>'+
    ch.tracks.slice(0,5).map(t=>{const m=moveOf(t);return '<li><span class="r">'+t.r+'</span><span class="s">'+esc(t.t)+' <small>'+esc(t.a)+'</small></span><span class="mv '+m.c+'">'+m.s+'</span></li>'}).join("")+'</ol></button>').join("");
  document.querySelectorAll(".pl,.mini").forEach(b=>b.addEventListener("click",()=>{chSel=+b.dataset.i;renderCharts();
    if(b.classList.contains("pl")||innerWidth<720)document.getElementById("focus").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"})}));
  renderFocus();layoutOrbit()}
function ago(d){if(!d)return"";const n=Math.floor((Date.now()-Date.parse(d))/864e5);return n<1?L().today:n+L().day}

  d:{ko:"한국 씬에서 '펑킹'은 이 펑크 스타일 전반이나 소울트레인식 펑크 그루브 프리스타일을 가리키는 경우가 많아요. 범위는 씬마다 조금씩 달라요.",ja:"韓国のシーンで「ファンキング」は、このファンクスタイル全般やソウル・トレイン的なファンクグルーヴのフリースタイルを指すことが多く、範囲はシーンによって少し異なります。",en:"In the Korean scene 'funking' usually means this whole family, or a Soul Train-style funk-groove freestyle. Exactly what it covers varies by scene.",zh:"在韩国舞蹈圈，“Funking”多指整个放克风格，或《灵魂列车》式的放克律动自由舞，具体范围因圈子而异。"},
  m:"P-Funk → boogie · electro funk → modern nu-funk",
  s:[["Flash Light","Parliament",1977],["Give It to Me Baby","Rick James",1981],["Let's Groove","Earth, Wind & Fire",1981]]},
 {id:"lock",c:"#ffd95a",start:1970,peaks:[[1970,1985]],place:"Los Angeles",
  n:{ko:"락킹",ja:"ロッキング",en:"Locking",zh:"锁舞"},
  o:{ko:"1970년 전후 LA에서 돈 캠벨이 춤을 배우다 동작이 '멈칫'하는 순간을 스타일로 만든 게 시작이에요.",ja:"1970年前後のLAで、ドン・キャンベルが踊りの途中で動きが「止まる」瞬間をスタイルにしたのが始まりです。",en:"Around 1970 in LA, Don Campbell turned the moments where his moves 'locked' into a style of their own.",zh:"1970年前后，唐·坎贝尔在洛杉矶把跳舞时动作“卡住”的瞬间变成了一种风格。"},
  d:{ko:"TV 쇼 〈Soul Train〉으로 퍼졌고, 1973년 결성된 The Lockers가 포인트·리스트 롤·스쿠비두 같은 기본기와 코믹한 무대 매너를 정립했어요.",ja:"TV番組『ソウル・トレイン』で広まり、1973年結成のThe Lockersがポイント、リストロール、スクービードゥーなどの基本とコミカルな舞台マナーを確立しました。",en:"Soul Train spread it nationwide, and The Lockers (formed 1973) set the vocabulary — points, wrist rolls, the Scooby Doo — and the comic stage presence.",zh:"借电视节目《灵魂列车》传遍全美，1973年成立的The Lockers确立了Point、Wrist Roll、Scooby Doo等基本动作与诙谐的舞台风格。"},
  m:"James Brown funk → 70s soul · disco funk",

 {id:"waack",c:"#ff5fd2",start:1971,peaks:[[1971,1981],[2003,2026]],place:"Los Angeles",
  n:{ko:"왁킹",ja:"ワッキング",en:"Waacking",zh:"Waacking"},
  o:{ko:"70년대 초 LA 게이 클럽에서 '펑킹(Punking)'이라는 이름으로 시작됐어요. 머리 위로 팔을 휘두르는 동작, 포즈, 표정 연기가 핵심이에요.",ja:"70年代初頭、LAのゲイクラブで「パンキング」という名で始まりました。頭上で腕を振る動き、ポーズ、表情の演技が核です。",en:"It began in early-1970s LA gay clubs under the name 'punking' — overhead arm whips, poses and facial drama are its core.",zh:"70年代初诞生于洛杉矶的同志俱乐部，最初叫“Punking”，核心是头顶甩臂、定格姿势与表情演绎。"},
  d:{ko:"〈Soul Train〉 댄서 타이론 프록터 등을 통해 알려졌다가 80년대에 사라졌고, 2000년대에 브라이언 그린·프린세스 락커루 등이 되살려 한국·일본 씬에서 크게 자랐어요. 뉴욕 볼룸의 보깅과는 뿌리가 달라요.",ja:"『ソウル・トレイン』のダンサー、タイロン・プロクターらを通じて知られた後、80年代に一度消え、2000年代にブライアン・グリーンやプリンセス・ロッカルーらが復活させ、日韓のシーンで大きく育ちました。NYボールルームのヴォーギングとは別のルーツです。",en:"Made known by Soul Train dancers like Tyrone Proctor, it faded in the 80s and was revived in the 2000s by Brian Green, Princess Lockerooo and others, growing big in Japan and Korea. It is a different lineage from New York ballroom voguing.",zh:"经《灵魂列车》舞者泰隆·普罗克特等人走红，80年代一度消失，2000年代由布莱恩·格林、Princess Lockerooo等人复兴，在日韩舞蹈圈壮大。与纽约Ballroom的Voguing并非同源。"},

 {id:"old",c:"#a6f56a",start:1973,peaks:[[1973,1986]],place:"The Bronx, NYC",
  n:{ko:"올드스쿨 힙합",ja:"オールドスクール",en:"Old School",zh:"老派嘻哈"},
  o:{ko:"1973년 브롱크스에서 DJ 쿨 허크가 곡의 브레이크 구간을 늘려 틀면서 브레이킹(비보잉)이 시작됐어요. 아프리카 밤바타의 줄루 네이션이 힙합을 문화로 묶었어요.",ja:"1973年ブロンクスでDJクール・ハークが曲のブレイク部分を延ばして流したことからブレイキン(Bボーイング)が始まり、アフリカ・バンバータのズールー・ネーションがヒップホップを文化としてまとめました。",en:"In 1973 in the Bronx, DJ Kool Herc looped the breaks of records and breaking (b-boying) was born; Afrika Bambaataa's Zulu Nation bound hip hop into a culture.",zh:"1973年，DJ Kool Herc在布朗克斯延长唱片的Break段落，霹雳舞由此诞生；Afrika Bambaataa的Zulu Nation把嘻哈凝聚成一种文化。"},
  d:{ko:"브레이킹·업락·초기 파티 댄스가 서부의 펑크 스타일과 섞이며 80년대 영화와 방송으로 퍼졌어요.",ja:"ブレイキン、アップロック、初期のパーティーダンスが西海岸のファンクスタイルと混ざり、80年代の映画や放送で広まりました。",en:"Breaking, uprock and early party dances mixed with the West Coast funk styles and spread through 80s films and TV.",zh:"霹雳舞、Uprock与早期派对舞与西海岸放克风格交融，借80年代电影和电视传播开来。"},

 {id:"pop",c:"#6fe6ff",start:1976,peaks:[[1977,1988],[2008,2026]],place:"Fresno, California",
  n:{ko:"팝핀",ja:"ポッピン",en:"Popping",zh:"机械舞"},
  o:{ko:"70년대 중후반 프레즈노에서 부갈루 샘이 근육을 튕기는 '팝'과 '부갈루'를 만들고, 1977년 Electric Boogaloos를 결성했어요.",ja:"70年代半ば〜後半のフレズノで、ブガルー・サムが筋肉を弾く「ポップ」と「ブガルー」を生み、1977年にElectric Boogaloosを結成しました。",en:"In mid-to-late-70s Fresno, Boogaloo Sam created the muscle-snapping 'pop' and the boogaloo, forming the Electric Boogaloos in 1977.",zh:"70年代中后期，Boogaloo Sam在弗雷斯诺发明了弹动肌肉的“Pop”与“Boogaloo”，并于1977年组建Electric Boogaloos。"},
  d:{ko:"로봇·애니메이션·웨이브·터팅이 붙었고, 마이클 잭슨의 문워크와 영화 〈Breakin'〉(1984)으로 세계에 퍼졌어요. 2000년대 이후 일렉트로닉 음악 위의 애니메이션 스타일로 다시 진화했어요.",ja:"ロボット、アニメーション、ウェーブ、タッティングが加わり、マイケル・ジャクソンのムーンウォークや映画『ブレイキン』(1984)で世界へ。2000年代以降はエレクトロニック音楽の上でアニメーションスタイルとして再進化しました。",en:"Robot, animation, waving and tutting joined in; Michael Jackson's moonwalk and the film Breakin' (1984) took it worldwide. Since the 2000s it has evolved again as animation over electronic music.",zh:"融入机器人、动画、Wave、Tutting等分支，借迈克尔·杰克逊的太空步和电影《Breakin'》(1984)风靡全球；2000年代后在电子音乐上以动画风格再度进化。"},

 {id:"house",c:"#a991ff",start:1985,peaks:[[1986,2002],[2014,2026]],place:"Chicago · New York",
  n:{ko:"하우스",ja:"ハウス",en:"House",zh:"浩室舞"},
  o:{ko:"80년대 중반 시카고 웨어하우스(프랭키 너클스)와 뉴욕 파라다이스 개러지(래리 레반)의 클럽 문화에서 나왔어요.",ja:"80年代半ば、シカゴのウェアハウス(フランキー・ナックルズ)とNYのパラダイス・ガラージ(ラリー・レヴァン)のクラブ文化から生まれました。",en:"It came out of mid-80s club culture: Chicago's Warehouse (Frankie Knuckles) and New York's Paradise Garage (Larry Levan).",zh:"诞生于80年代中期的俱乐部文化：芝加哥的Warehouse(Frankie Knuckles)与纽约的Paradise Garage(Larry Levan)。"},
  d:{ko:"뉴욕 클럽 댄서들이 풋워크·잭킹·로프팅을 조합해 춤으로 정립했고, 90년대 이후 유럽·일본으로 퍼져 지금은 배틀 장르로 자리 잡았어요.",ja:"NYのクラブダンサーがフットワーク、ジャッキング、ロフティングを組み合わせてダンスとして確立。90年代以降ヨーロッパや日本に広がり、今ではバトルジャンルとして定着しています。",en:"New York club dancers combined footwork, jacking and lofting into a dance; from the 90s it spread to Europe and Japan and is now a battle category.",zh:"纽约俱乐部舞者把Footwork、Jacking、Lofting组合成一门舞蹈；90年代后传到欧洲和日本，如今已是比赛项目。"},

 {id:"mid",c:"#d7f56a",start:1987,peaks:[[1987,1995]],place:"USA",
  n:{ko:"미들스쿨 힙합",ja:"ミドルスクール",en:"Middle School",zh:"中派嘻哈"},
  o:{ko:"80년대 말~90년대 초 뉴잭스윙 시대의 '파티 댄스' 황금기예요. 러닝맨·로저래빗·캐비지패치·왑·키드앤플레이 킥스텝처럼 이름 붙은 스텝이 쏟아졌어요.",ja:"80年代末〜90年代初頭、ニュージャックスウィング期の「パーティーダンス」黄金期。ランニングマン、ロジャーラビット、キャベッジパッチ、ワップ、キッド・ン・プレイのキックステップなど名前付きのステップが次々に生まれました。",en:"The late-80s to early-90s golden age of named party dances in the new jack swing era: Running Man, Roger Rabbit, Cabbage Patch, the Wop, the Kid 'n Play kick step.",zh:"80年代末至90年代初新杰克摇摆时代的“派对舞”黄金期：Running Man、Roger Rabbit、Cabbage Patch、Wop、Kid 'n Play踢步等有名字的舞步层出不穷。"},
  d:{ko:"바운스 리듬이 정착했고, MC 해머·바비 브라운 같은 뮤지션의 무대 퍼포먼스가 안무의 교과서가 됐어요.",ja:"バウンスのリズムが定着し、MCハマーやボビー・ブラウンらのステージパフォーマンスが振付の教科書になりました。",en:"The bounce settled in, and stage performances by MC Hammer and Bobby Brown became the textbook for choreography.",zh:"Bounce律动就此定型，MC Hammer、Bobby Brown等人的舞台表演成了编舞教科书。"},
  m:"New jack swing (swing beat + R&B + hip hop) · golden-age boom bap",

 {id:"new",c:"#7dffb2",start:1995,peaks:[[1995,2010]],place:"USA → worldwide",
  n:{ko:"뉴스쿨 힙합",ja:"ニュースクール",en:"New School",zh:"新派嘻哈"},
  o:{ko:"90년대 중반 이후 바운스가 무거워지고 그루브가 다양해졌어요. 할렘 셰이크·뱅크헤드 바운스·치킨 누들 수프 같은 지역 스텝이 생겼고, 2000년대 LA에선 크럼프도 등장했어요.",ja:"90年代半ば以降、バウンスが重くなりグルーヴが多様化。ハーレムシェイク、バンクヘッドバウンス、チキンヌードルスープなど地域のステップが生まれ、2000年代のLAではクランプも登場しました。",en:"From the mid-90s the bounce got heavier and grooves diversified — local steps like the Harlem Shake, Bankhead Bounce and Chicken Noodle Soup, and krump in 2000s LA.",zh:"90年代中期后Bounce更厚重、律动更多样，出现了Harlem Shake、Bankhead Bounce、Chicken Noodle Soup等地方舞步，2000年代洛杉矶还诞生了Krump。"},
  d:{ko:"스텝을 조합한 프리스타일과 배틀 문화로 발전했고, 이후 걸스힙합과 코레오의 기본 어휘가 됐어요.",ja:"ステップを組み合わせたフリースタイルとバトル文化へ発展し、のちにガールズヒップホップやコレオの基本語彙になりました。",en:"It grew into step-combining freestyle and battle culture, and became the base vocabulary of girls hip hop and choreography.",zh:"发展为组合舞步的自由舞与Battle文化，后来成为女子嘻哈与编舞的基本词汇。"},

 {id:"girls",c:"#ff9ad5",start:2000,peaks:[[2005,2026]],place:"Japan · Korea",
  n:{ko:"걸스힙합",ja:"ガールズヒップホップ",en:"Girls Hip Hop",zh:"女子嘻哈"},
  o:{ko:"미국에서 온 공식 장르명이 아니라 일본·한국 댄스씬에서 굳어진 이름이에요. 힙합 그루브 위에 웨이브·힙 무브먼트·태도와 표정을 강조해요.",ja:"アメリカ発の正式なジャンル名ではなく、日本・韓国のダンスシーンで定着した名前です。ヒップホップのグルーヴにウェーブ、ヒップの動き、アティテュードと表情を強調します。",en:"Not an American genre name but one settled in the Japanese and Korean scenes: hip hop groove with emphasis on waves, hip movement, attitude and expression.",zh:"并非源自美国的正式名称，而是在日韩舞蹈圈定型的叫法：在嘻哈律动上强调Wave、胯部动作、态度与表情。"},
  d:{ko:"90~2000년대 여성 아티스트의 뮤직비디오 안무(알리야·자넷 잭슨·시애라·비욘세)가 교과서가 됐고, 2010년대에는 패리스 고블의 영향으로 댄스홀 감성이 강해졌어요.",ja:"90〜2000年代の女性アーティストのMV振付(アリーヤ、ジャネット・ジャクソン、シアラ、ビヨンセ)が教科書となり、2010年代にはパリス・ゴーベルの影響でダンスホールの色が濃くなりました。",en:"Music-video choreography by women artists of the 90s–2000s (Aaliyah, Janet Jackson, Ciara, Beyoncé) was the textbook; in the 2010s Parris Goebel's influence brought in more dancehall.",zh:"90至2000年代女歌手的MV编舞(Aaliyah、珍妮·杰克逊、Ciara、碧昂丝)是教科书；2010年代受Parris Goebel影响，Dancehall味道更浓。"},

 {id:"choreo",c:"#9fb8ff",start:2008,peaks:[[2008,2026]],place:"LA → YouTube → Seoul",
  n:{ko:"코레오",ja:"コレオ",en:"Choreography",zh:"编舞"},
  o:{ko:"동작 스타일이 아니라 '곡 하나를 해석해 짠 안무'라는 형식이에요. 여러 장르를 섞어 가사와 음악을 시각화해요.",ja:"動きのスタイルではなく「1曲を解釈して作る振付」という形式です。複数のジャンルを混ぜて歌詞と音楽を可視化します。",en:"A format rather than a movement style: choreography built by interpreting one song, mixing genres to visualise the lyrics and music.",zh:"不是一种动作风格，而是“诠释一首歌而编排的舞蹈”这一形式，融合多种舞风把歌词和音乐可视化。"},
  d:{ko:"90년대 LA 밀레니엄 댄스 컴플렉스 같은 스튜디오 문화에서 자라, 2008년 MTV 〈America's Best Dance Crew〉와 유튜브 시대에 폭발했어요. 2014년 서울 원밀리언 댄스 스튜디오를 거치며 K-pop 안무 생태계와 합쳐졌어요.",ja:"90年代LAのミレニアム・ダンス・コンプレックスなどのスタジオ文化で育ち、2008年のMTV『America's Best Dance Crew』とYouTube時代に爆発。2014年ソウルの1MILLION Dance Studioを経てK-POP振付の生態系と合流しました。",en:"It grew in studio culture like LA's Millennium Dance Complex in the 90s, exploded with MTV's America's Best Dance Crew (2008) and YouTube, and merged with K-pop choreography via Seoul's 1MILLION Dance Studio (2014).",zh:"在90年代洛杉矶Millennium Dance Complex等工作室文化中成长，借2008年MTV《America's Best Dance Crew》和YouTube时代爆发，2014年经首尔1MILLION Dance Studio与K-pop编舞生态汇合。"},

const SP_SCOPES="playlist-modify-private playlist-modify-public";
const RP_N=30;

const RPT=()=>L().rp;
function rpEsc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rpModal(html,actions){let m=document.getElementById("rp-modal");if(!m){m=document.createElement("div");m.id="rp-modal";m.className="rp-modal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");document.body.append(m)}
  m.innerHTML='<div class="rp-box">'+html+'<div class="rp-act"></div></div>';const act=m.querySelector(".rp-act");
  (actions||[]).forEach(([label,fn,primary])=>{const b=document.createElement(fn&&fn.href?"a":"button");b.className="rp-b"+(primary?" pri":"");b.textContent=label;if(fn&&fn.href){b.href=fn.href;b.target="_blank";b.rel="noopener"}else{b.type="button";b.onclick=fn||rpClose}act.append(b)});
  m.hidden=false;const f=act.querySelector(".pri")||act.querySelector("button");f&&f.focus()}
function rpClose(){const m=document.getElementById("rp-modal");if(m)m.hidden=true}
document.addEventListener("keydown",e=>{if(e.key==="Escape")rpClose()});
function rpShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function rpRand(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return b64url(a).slice(0,n)}
function rpStore(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function rpLoad(k){try{return JSON.parse(sessionStorage.getItem(k)||"null")}catch(e){return null}}
/* entry point: label = tab name for the playlist title, pool = [{t,a,id?}] */
function rpOpen(label,pool){const T=RPT();
  if(!SP_CLIENT_ID||SP_CLIENT_ID.startsWith("__")){rpModal('<h3>'+rpEsc(T.title)+'</h3><p>'+rpEsc(T.noid)+'</p>',[[T.cancel,null,true]]);return}
  const uniq=[];const seen=new Set();pool.forEach(s=>{const k=(s.id||(s.t+"|"+s.a)).toLowerCase();if(!seen.has(k)){seen.add(k);uniq.push(s)}});
  rpModal('<h3>'+rpEsc(T.title)+' · '+rpEsc(label)+'</h3><p>'+rpEsc(T.go)+'</p><p class="rp-sub">'+uniq.length+' songs</p>',[[T.cancel,null],[T.start,()=>rpAuth(label,uniq),true]])}
async function rpAuth(label,pool){const tok=rpLoad("rp-token");const job={label,pool:rpShuffle(pool).slice(0,Math.min(pool.length,RP_N*2)).map(s=>({t:s.t,a:s.a,id:s.id||null})),lang,hash:location.hash};
  rpStore("rp-job",job);
  if(tok&&tok.exp>Date.now()+60000){rpRun(tok.access);return}
  const verifier=rpRand(64),state=rpRand(16);rpStore("rp-pkce",{verifier,state});
  const ch=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
  const q=new URLSearchParams({client_id:SP_CLIENT_ID,response_type:"code",redirect_uri:SP_REDIRECT,scope:SP_SCOPES,code_challenge_method:"S256",code_challenge:ch,state});
  location.href="https://accounts.spotify.com/authorize?"+q}
async function rpReturn(){const p=new URLSearchParams(location.search);if(!p.has("code")&&!p.has("error"))return;
  const pk=rpLoad("rp-pkce"),job=rpLoad("rp-job");history.replaceState(null,"",SP_REDIRECT+(job&&job.hash||""));
  if(job&&job.lang&&I18N[job.lang]&&job.lang!==lang)applyLang(job.lang);
  const T=RPT();if(job&&job.hash&&typeof route==="function")route();
  if(p.has("error")||!pk||p.get("state")!==pk.state){rpModal('<h3>'+rpEsc(T.title)+'</h3><p>'+rpEsc(T.denied)+'</p>',[[T.cancel,null,true]]);return}
  rpModal('<h3>'+rpEsc(T.title)+'</h3><p class="rp-st">'+rpEsc(T.find)+'</p>');
  try{const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({client_id:SP_CLIENT_ID,grant_type:"authorization_code",code:p.get("code"),redirect_uri:SP_REDIRECT,code_verifier:pk.verifier})});
    const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.error||r.status);
    rpStore("rp-token",{access:j.access_token,exp:Date.now()+j.expires_in*1000});rpStore("rp-pkce",null);rpRun(j.access_token)}
  catch(e){rpModal('<h3>'+rpEsc(T.fail)+'</h3><p class="rp-sub">'+rpEsc(e.message)+'</p>',[[T.cancel,null,true]])}}
async function rpApi(tok,path,opt){const r=await fetch("https://api.spotify.com/v1"+path,Object.assign({},opt,{headers:Object.assign({Authorization:"Bearer "+tok,"Content-Type":"application/json"},(opt||{}).headers)}));
  if(r.status===429){await new Promise(x=>setTimeout(x,(+r.headers.get("Retry-After")||2)*1000));return rpApi(tok,path,opt)}
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok){const err=new Error((j&&j.error&&j.error.message)||r.status);err.status=r.status;throw err}return j}
const rpClean=t=>String(t).replace(/\s*[\(\[]\s*(feat|ft|with|prod|from)[^\)\]]*[\)\]]/gi,"").replace(/\s+-\s+.*$/,"").trim();
async function rpFind(tok,s){if(s.id)return "spotify:track:"+s.id;const a=String(s.a).split(",")[0].trim(),t=rpClean(s.t);
  for(const q of ['track:"'+t+'" artist:"'+a+'"',t+" "+a]){const j=await rpApi(tok,"/search?type=track&limit=1&q="+encodeURIComponent(q));const it=j&&j.tracks&&j.tracks.items&&j.tracks.items[0];if(it)return it.uri}return null}
async function rpRun(tok){const job=rpLoad("rp-job"),T=RPT();if(!job)return;const st=()=>document.querySelector("#rp-modal .rp-st");
  rpModal('<h3>'+rpEsc(T.title)+' · '+rpEsc(job.label)+'</h3><p class="rp-st">'+rpEsc(T.find)+'</p><div class="rp-bar"><i></i></div>');
  const bar=()=>document.querySelector("#rp-modal .rp-bar i");
  try{const uris=[];for(const s of job.pool){if(uris.length>=RP_N)break;let u=null;try{u=await rpFind(tok,s)}catch(e){if(e.status===401||e.status===403)throw e}
      if(u&&!uris.includes(u))uris.push(u);if(bar())bar().style.width=(uris.length/RP_N*100)+"%";if(st())st().textContent=T.find+"  "+uris.length+"/"+RP_N}
    if(st())st().textContent=T.make;
    const d=new Date().toISOString().slice(0,10);
    const pl=await rpApi(tok,"/me/playlists",{method:"POST",body:JSON.stringify({name:RP_SITE+" · "+job.label+" · Random "+uris.length+" ("+d+")",public:false,description:"Random "+uris.length+" from "+SP_REDIRECT})});
    await rpApi(tok,"/playlists/"+pl.id+"/items",{method:"POST",body:JSON.stringify({uris})});
    rpStore("rp-job",null);const url=pl.external_urls&&pl.external_urls.spotify||"https://open.spotify.com/playlist/"+pl.id;
    rpModal('<h3>'+rpEsc(T.done)+'</h3><p class="rp-sub">'+rpEsc(pl.name)+'</p>',[[T.cancel,null],[T.open,{href:url},true]]);
    setTimeout(()=>{location.href=url},1200)}
  catch(e){if(e.status===401)rpStore("rp-token",null);rpModal('<h3>'+rpEsc(T.fail)+'</h3><p>'+rpEsc(e.status===403?T.notallowed:"")+'</p><p class="rp-sub">'+rpEsc(e.message)+'</p>',[[T.cancel,null,true]])}}

function route(){const h=location.hash,v=h==="#charts"?"charts":h==="#history"?"history":"atlas";
  ["atlas","charts","history"].forEach(k=>{document.getElementById("v-"+k).hidden=v!==k;const t=document.getElementById("t-"+k);if(v===k)t.setAttribute("aria-current","page");else t.removeAttribute("aria-current")});
  if(v==="atlas")requestAnimationFrame(resize);else if(v==="charts")layoutOrbit();else{renderHistory();const hs=document.getElementById("h-scroll");document.getElementById("h-hint").hidden=hs.scrollWidth<=hs.clientWidth}}
addEventListener("hashchange",()=>{route();scrollTo(0,0)});
function applyLang(l){lang=l;const D=L();document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(el=>{if(el.closest(".pl,.mini"))return;if(D[el.dataset.i]!=null)el.textContent=D[el.dataset.i]});
  const q=document.getElementById("q");q.placeholder=D.search;q.setAttribute("aria-label",D.search);
  document.getElementById("c-x").setAttribute("aria-label",D.close);
  mWrap.querySelectorAll(".chip").forEach(b=>{b.title=D.mood[b.dataset.m]||""});
  songs.forEach(s=>s.el.setAttribute("aria-label",s.t+" — "+s.a+" ("+D.openIn+")"));
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  if(CH)renderCharts();renderLive();if(!document.getElementById("v-history").hidden)renderHistory();
  document.querySelectorAll(".rp-btn").forEach(b=>b.textContent=D.rp.btn);
  try{localStorage.setItem("dtd-lang",l)}catch(e){}}
document.querySelectorAll("#lang button").forEach(b=>b.addEventListener("click",()=>applyLang(b.dataset.l)));
applyLang(lang);route();rpReturn();
const sc=document.getElementById("scroller");requestAnimationFrame(()=>{if(sc.scrollWidth>sc.clientWidth)sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)/2;else document.getElementById("m-hint").hidden=true});
loadCharts();setInterval(loadCharts,POLL);
